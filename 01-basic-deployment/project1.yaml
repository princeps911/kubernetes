---
# 1. The ConfigMap: This holds your custom HTML
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-index-config
  namespace: ceps-webapp
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hello from Kubernetes!</title>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Archivo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
        <style>
            :root {
                --k8s-blue: #326ce5;
                --k8s-light-blue: #5a9cff;
                --k8s-dark: #1a1d29;
                --k8s-darker: #0f111a;
                --cyan-accent: #00d4ff;
                --purple-accent: #b47eff;
                --green-accent: #00e676;
                --text-primary: #ffffff;
                --text-secondary: #a8b3cf;
                --card-bg: rgba(26, 29, 41, 0.6);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Archivo', sans-serif;
                background: var(--k8s-darker);
                color: var(--text-primary);
                min-height: 100vh;
                overflow-x: hidden;
                position: relative;
            }

            /* Animated Background */
            .k8s-background {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -2;
                background: linear-gradient(135deg, #0f111a 0%, #1a1d29 50%, #0f111a 100%);
            }

            .k8s-background::before {
                content: '';
                position: absolute;
                width: 100%;
                height: 100%;
                background-image: 
                    radial-gradient(circle at 20% 30%, rgba(50, 108, 229, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 50% 50%, rgba(180, 126, 255, 0.08) 0%, transparent 60%);
                animation: pulseGlow 8s ease-in-out infinite;
            }

            @keyframes pulseGlow {
                0%, 100% { opacity: 0.8; transform: scale(1); }
                50% { opacity: 1; transform: scale(1.1); }
            }

            /* Hexagon Grid Pattern */
            .hex-grid {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
                opacity: 0.03;
                background-image: 
                    linear-gradient(30deg, var(--k8s-blue) 12%, transparent 12.5%, transparent 87%, var(--k8s-blue) 87.5%, var(--k8s-blue)),
                    linear-gradient(150deg, var(--k8s-blue) 12%, transparent 12.5%, transparent 87%, var(--k8s-blue) 87.5%, var(--k8s-blue)),
                    linear-gradient(30deg, var(--k8s-blue) 12%, transparent 12.5%, transparent 87%, var(--k8s-blue) 87.5%, var(--k8s-blue)),
                    linear-gradient(150deg, var(--k8s-blue) 12%, transparent 12.5%, transparent 87%, var(--k8s-blue) 87.5%, var(--k8s-blue));
                background-size: 80px 140px;
                background-position: 0 0, 0 0, 40px 70px, 40px 70px;
            }

            /* Floating Particles */
            .particles {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
                pointer-events: none;
            }

            .particle {
                position: absolute;
                width: 4px;
                height: 4px;
                background: var(--cyan-accent);
                border-radius: 50%;
                opacity: 0.3;
                animation: float 20s infinite ease-in-out;
            }

            .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
            .particle:nth-child(2) { left: 20%; animation-delay: 2s; background: var(--purple-accent); }
            .particle:nth-child(3) { left: 30%; animation-delay: 4s; }
            .particle:nth-child(4) { left: 40%; animation-delay: 1s; background: var(--green-accent); }
            .particle:nth-child(5) { left: 50%; animation-delay: 3s; }
            .particle:nth-child(6) { left: 60%; animation-delay: 5s; background: var(--purple-accent); }
            .particle:nth-child(7) { left: 70%; animation-delay: 2.5s; }
            .particle:nth-child(8) { left: 80%; animation-delay: 4.5s; background: var(--cyan-accent); }
            .particle:nth-child(9) { left: 90%; animation-delay: 1.5s; }

            @keyframes float {
                0%, 100% { 
                    transform: translateY(100vh) scale(1); 
                    opacity: 0;
                }
                10%, 90% {
                    opacity: 0.4;
                }
                50% { 
                    transform: translateY(-10vh) scale(1.5);
                    opacity: 0.8;
                }
            }

            /* Main Container */
            .container {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 2rem;
                position: relative;
                z-index: 1;
            }

            /* Card */
            .k8s-card {
                background: var(--card-bg);
                backdrop-filter: blur(20px);
                border: 2px solid rgba(50, 108, 229, 0.3);
                border-radius: 24px;
                padding: 3rem 2.5rem;
                max-width: 700px;
                width: 100%;
                box-shadow: 
                    0 20px 60px rgba(0, 0, 0, 0.5),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
                position: relative;
                overflow: hidden;
                animation: cardEntrance 0.8s ease-out;
            }

            @keyframes cardEntrance {
                from {
                    opacity: 0;
                    transform: translateY(30px) scale(0.95);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            .k8s-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, rgba(50, 108, 229, 0.1) 0%, transparent 50%);
                pointer-events: none;
            }

            /* Kubernetes Logo */
            .k8s-logo {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 2rem;
                animation: logoFloat 3s ease-in-out infinite;
            }

            @keyframes logoFloat {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-10px); }
            }

            .logo-hexagon {
                width: 120px;
                height: 120px;
                background: linear-gradient(135deg, var(--k8s-blue) 0%, var(--k8s-light-blue) 100%);
                clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                box-shadow: 0 10px 40px rgba(50, 108, 229, 0.4);
            }

            .logo-hexagon::before {
                content: '☸';
                font-size: 4rem;
                color: white;
                animation: spin 20s linear infinite;
            }

            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }

            /* Typography */
            h1 {
                font-size: 3rem;
                font-weight: 900;
                text-align: center;
                margin-bottom: 1rem;
                background: linear-gradient(135deg, #ffffff 0%, var(--cyan-accent) 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                letter-spacing: -1px;
                animation: slideInDown 0.8s ease-out 0.2s backwards;
            }

            @keyframes slideInDown {
                from {
                    opacity: 0;
                    transform: translateY(-20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            h2 {
                font-size: 1.8rem;
                font-weight: 700;
                text-align: center;
                margin-bottom: 2rem;
                color: var(--cyan-accent);
                letter-spacing: 0.5px;
                animation: slideInDown 0.8s ease-out 0.3s backwards;
            }

            .user-badge {
                background: linear-gradient(135deg, rgba(0, 212, 255, 0.2) 0%, rgba(180, 126, 255, 0.2) 100%);
                border: 1px solid var(--cyan-accent);
                padding: 0.5rem 1.2rem;
                border-radius: 50px;
                display: inline-block;
                font-weight: 600;
            }

            /* Info Section */
            .info-section {
                background: rgba(50, 108, 229, 0.1);
                border: 1px solid rgba(50, 108, 229, 0.3);
                border-radius: 16px;
                padding: 1.5rem;
                margin-top: 2rem;
                animation: slideInUp 0.8s ease-out 0.4s backwards;
            }

            @keyframes slideInUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .info-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 1rem 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .info-row:last-child {
                border-bottom: none;
            }

            .info-label {
                font-size: 0.95rem;
                color: var(--text-secondary);
                font-weight: 500;
                letter-spacing: 0.5px;
            }

            .info-value {
                font-family: 'JetBrains Mono', monospace;
                font-size: 1rem;
                font-weight: 700;
                color: var(--text-primary);
            }

            .hostname {
                color: var(--green-accent);
                background: rgba(0, 230, 118, 0.1);
                padding: 0.4rem 1rem;
                border-radius: 8px;
                border: 1px solid rgba(0, 230, 118, 0.3);
            }

            /* Pod Status Indicator */
            .pod-status {
                display: flex;
                align-items: center;
                gap: 2rem;
                margin-top: 2rem;
                padding: 1.5rem;
                background: rgba(0, 230, 118, 0.1);
                border: 1px solid rgba(0, 230, 118, 0.3);
                border-radius: 16px;
                animation: slideInUp 0.8s ease-out 0.5s backwards;
            }

            .status-indicator {
                display: flex;
                align-items: center;
                gap: 0.8rem;
            }

            .status-dot {
                width: 12px;
                height: 12px;
                background: var(--green-accent);
                border-radius: 50%;
                box-shadow: 0 0 20px var(--green-accent);
                animation: pulse 2s ease-in-out infinite;
            }

            @keyframes pulse {
                0%, 100% { 
                    transform: scale(1); 
                    opacity: 1;
                }
                50% { 
                    transform: scale(1.3); 
                    opacity: 0.7;
                }
            }

            .status-text {
                font-weight: 600;
                font-size: 1.1rem;
                color: var(--green-accent);
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .status-details {
                font-family: 'JetBrains Mono', monospace;
                color: var(--text-secondary);
                font-size: 0.9rem;
            }

            /* Decorative Elements */
            .corner-decoration {
                position: absolute;
                width: 100px;
                height: 100px;
                border: 2px solid rgba(50, 108, 229, 0.2);
                pointer-events: none;
            }

            .corner-tl {
                top: -1px;
                left: -1px;
                border-right: none;
                border-bottom: none;
                border-radius: 24px 0 0 0;
            }

            .corner-br {
                bottom: -1px;
                right: -1px;
                border-left: none;
                border-top: none;
                border-radius: 0 0 24px 0;
            }

            /* Responsive */
            @media (max-width: 768px) {
                .k8s-card {
                    padding: 2rem 1.5rem;
                }

                h1 {
                    font-size: 2rem;
                }

                h2 {
                    font-size: 1.3rem;
                }

                .logo-hexagon {
                    width: 90px;
                    height: 90px;
                }

                .logo-hexagon::before {
                    font-size: 3rem;
                }

                .pod-status {
                    flex-direction: column;
                    align-items: flex-start;
                    gap: 1rem;
                }

                .info-row {
                    flex-direction: column;
                    align-items: flex-start;
                    gap: 0.5rem;
                }
            }

            /* Hover Effects */
            .k8s-card:hover {
                border-color: rgba(50, 108, 229, 0.6);
                box-shadow: 
                    0 25px 70px rgba(0, 0, 0, 0.6),
                    0 0 80px rgba(50, 108, 229, 0.2),
                    inset 0 1px 0 rgba(255, 255, 255, 0.15);
                transform: translateY(-5px);
                transition: all 0.4s ease;
            }
        </style>
    </head>
    <body>
        <!-- Animated Background -->
        <div class="k8s-background"></div>
        <div class="hex-grid"></div>
        
        <!-- Floating Particles -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <!-- Main Container -->
        <div class="container">
            <div class="k8s-card">
                <!-- Corner Decorations -->
                <div class="corner-decoration corner-tl"></div>
                <div class="corner-decoration corner-br"></div>

                <!-- Kubernetes Logo -->
                <div class="k8s-logo">
                    <div class="logo-hexagon"></div>
                </div>

                <!-- Main Content -->
                <h1>Hello from Kubernetes!</h1>
                <h2>
                    <span class="user-badge">👤 The Great CepsDev</span>
                </h2>

                <!-- Info Section -->
                <div class="info-section">
                    <div class="info-row">
                        <span class="info-label">📅 Current Date</span>
                        <span class="info-value">March 27, 2026</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">🚀 Kubernetes Version</span>
                        <span class="info-value">v1.28.0</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">🌐 Namespace</span>
                        <span class="info-value">production</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">📦 Served by Pod</span>
                        <span class="info-value hostname">HOSTNAME</span>
                    </div>
                </div>

                <!-- Pod Status -->
                <div class="pod-status">
                    <div class="status-indicator">
                        <div class="status-dot"></div>
                        <span class="status-text">Running</span>
                    </div>
                    <div class="status-details">
                        All containers ready • Health check passed ✓
                    </div>
                </div>
            </div>
        </div>

        <script>
            // Update hostname dynamically if available
            document.addEventListener('DOMContentLoaded', function() {
                // Get actual hostname from environment variable if available
                const hostnameElement = document.querySelector('.hostname');
                
                // Try to get hostname from various sources
                if (window.location.hostname && window.location.hostname !== 'localhost') {
                    hostnameElement.textContent = window.location.hostname;
                }
                
                // Add current time update
                function updateTime() {
                    const now = new Date();
                    const timeString = now.toLocaleString('en-US', { 
                        month: 'long', 
                        day: 'numeric', 
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                    
                    const dateElements = document.querySelectorAll('.info-value');
                    if (dateElements.length > 0) {
                        dateElements[0].textContent = timeString;
                    }
                }
                
                // Update time every second
                updateTime();
                setInterval(updateTime, 1000);

                // Add interactive hover effect to card
                const card = document.querySelector('.k8s-card');
                card.addEventListener('mousemove', function(e) {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = (y - centerY) / 20;
                    const rotateY = (centerX - x) / 20;
                    
                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-5px)`;
                });
                
                card.addEventListener('mouseleave', function() {
                    card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) translateY(0)';
                });
            });

            // Create additional floating particles dynamically
            function createParticle() {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                
                const colors = ['var(--cyan-accent)', 'var(--purple-accent)', 'var(--green-accent)'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                document.querySelector('.particles').appendChild(particle);
                
                setTimeout(() => particle.remove(), 25000);
            }

            // Add new particles periodically
            setInterval(createParticle, 3000);
        </script>
    </body>
    </html>

---
# 2. The Deployment: Runs 2 replicas of Nginx
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
  namespace: ceps-webapp
  labels:
    app: static-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: static-site
  template:
    metadata:
      labels:
        app: static-site
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: web-index-config

---
# 3. The Service: Exposes the app to your browser
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: ceps-webapp
spec:
  type: NodePort
  selector:
    app: static-site
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30007